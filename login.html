<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1><a href="index.html" class="logo">متجري</a></h1>
    <a href="index.html" class="back">← رجوع للمتجر</a>
  </header>

  <main class="checkout">
    <div class="auth-tabs">
      <button type="button" id="tabLogin" class="active">دخول</button>
      <button type="button" id="tabRegister">حساب جديد</button>
    </div>

    <form id="authForm">
      <input id="aName" placeholder="الاسم" autocomplete="name" hidden>
      <input id="aEmail" type="email" placeholder="البريد الإلكتروني" autocomplete="email" required>
      <input id="aPass" type="password" placeholder="كلمة السر (8 أحرف على الأقل)" autocomplete="current-password" required>
      <button class="add" type="submit" id="aSubmit">دخول</button>
      <p id="aMsg" class="notfound"></p>
    </form>
  </main>

  <script src="login.js"></script>
</body>
</html>
